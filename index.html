<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Word Runner WebGL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed9ff;font-family:system-ui,"Noto Sans Thai",sans-serif;touch-action:none}
#game{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #0008}
.logo{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(#a86a2c,#6c3c18);border:4px solid #5b3116;border-radius:18px;padding:6px 18px;text-align:center;font-weight:1000;white-space:nowrap}
.logo b{font-size:clamp(22px,6vw,38px);color:#63c4ff}.logo small{display:block;font-size:13px}
.level{position:absolute;top:18px;left:10px;background:#75451fdd;border:3px solid #512e15;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12px;text-align:center}
.status{position:absolute;top:18px;right:10px;text-align:right;font-weight:900}
.score{background:#66545ddd;padding:6px 12px;border-radius:18px}.hearts{font-size:25px;margin-top:5px}.shield{background:#4f6175dd;padding:5px 10px;border-radius:15px;margin-top:4px;font-size:13px}
.word{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:#fff;color:#28132c;text-shadow:none;border:6px solid #ff68ad;border-radius:16px;box-shadow:0 7px 0 #c44f88;padding:7px 32px;font-size:clamp(30px,9vw,52px);font-weight:1000;min-width:45%;text-align:center}
.tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#213b5dbb;border:2px solid #ffffffaa;border-radius:20px;padding:8px 16px;font-weight:800;font-size:14px;white-space:nowrap}
.msg{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%) scale(0);background:#fff;color:#333;text-shadow:none;padding:14px 22px;border-radius:20px;font-size:24px;font-weight:1000;transition:.15s}
.msg.show{transform:translate(-50%,-50%) scale(1)}
#loading{position:fixed;inset:0;background:#82d4ff;display:grid;place-items:center;z-index:20;color:#263b55;font-weight:900;text-align:center;padding:30px}
#end{position:fixed;inset:0;background:#47366cdd;display:none;place-items:center;z-index:30;padding:24px}
.card{background:#fff;color:#3e3154;text-align:center;border-radius:25px;padding:25px;max-width:360px}
.card button{pointer-events:auto;border:0;background:#ff65a4;color:white;border-radius:16px;padding:12px 24px;font-size:18px;font-weight:900}
@media(max-width:520px){.logo{top:8px;padding:4px 10px}.logo small{display:none}.level{top:72px}.status{top:72px}.word{top:22%}}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
 <div class="logo"><b>3D Word Runner</b><small>ตะลุยกำแพงคำศัพท์!</small></div>
 <div class="level">LEVEL 1<br>กำแพงที่ <span id="progress">1</span> / 10</div>
 <div class="status"><div class="score">⭐ <span id="score">0</span></div><div class="hearts" id="hearts">❤️❤️❤️</div><div class="shield" id="shield">🛡️ ไม่มีโล่</div></div>
 <div class="word" id="word">CAT</div>
 <div class="msg" id="msg"></div>
 <div class="tip">👆 ปัดซ้าย–ขวาบนหน้าจอเพื่อเปลี่ยนเลน</div>
</div>
<div id="loading">กำลังโหลดโลก 3D…<br><small>ครั้งแรกต้องเชื่อมต่ออินเทอร์เน็ต</small></div>
<div id="end"><div class="card"><h1>🏆 จบรอบ!</h1><h2 id="final"></h2><p>เลือกความหมายให้ถูกต้องโดยปัดเปลี่ยนเลน</p><button id="restart">เล่นอีกครั้ง</button></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const DATA=[
 {w:"CAT",a:["แมว","สุนัข","นก"],ok:0},
 {w:"DOG",a:["ปลา","สุนัข","แมว"],ok:1},
 {w:"BIRD",a:["นก","ม้า","หมู"],ok:0},
 {w:"APPLE",a:["กล้วย","ส้ม","แอปเปิล"],ok:2},
 {w:"BOOK",a:["โต๊ะ","หนังสือ","ดินสอ"],ok:1},
 {w:"SUN",a:["ดวงอาทิตย์","ดาว","ฝน"],ok:0},
 {w:"WATER",a:["นม","น้ำ","ข้าว"],ok:1},
 {w:"HAPPY",a:["เศร้า","โกรธ","มีความสุข"],ok:2},
 {w:"RUN",a:["วิ่ง","นอน","นั่ง"],ok:0},
 {w:"SCHOOL",a:["บ้าน","โรงเรียน","ตลาด"],ok:1}
];
const lanes=[-2.45,0,2.45];
let scene,camera,renderer,runner,road=[],walls=[],shieldItem=null;
let lane=1,targetX=0,q=0,score=0,lives=3,hasShield=false,paused=false,last=0;
let wallZ=-36, shieldSpawned=false;
const $=id=>document.getElementById(id);

function mat(c,rough=.65){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.03})}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function sphere(r,c){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mat(c));m.castShadow=true;return m}
function textTexture(txt,bg="#168be0"){
 const c=document.createElement("canvas");c.width=512;c.height=256;const x=c.getContext("2d");
 x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.strokeStyle="#ffffff55";x.lineWidth=14;x.strokeRect(8,8,496,240);
 x.fillStyle="white";x.font='900 74px system-ui, "Noto Sans Thai", sans-serif';x.textAlign="center";x.textBaseline="middle";
 x.fillText(txt,256,128,450);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x80d5ff);scene.fog=new THREE.Fog(0xaddfff,28,75);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,120);camera.position.set(0,4.5,8.2);camera.lookAt(0,1,-9);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;$("game").appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x88a76a,2.4));
 const sun=new THREE.DirectionalLight(0xffffff,2.8);sun.position.set(-5,12,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 makeWorld();makeRunner();spawnQuestion();bind();$("loading").style.display="none";requestAnimationFrame(loop);
}
function makeWorld(){
 const colors=[0x29a7f2,0xff6f91,0x55d567];
 for(let s=0;s<12;s++){
  const g=new THREE.Group();g.position.z=-s*8;
  for(let j=0;j<3;j++){const p=box(2.35,.12,7.7,colors[j]);p.position.set(lanes[j],0,0);g.add(p)}
  for(let j=0;j<2;j++){const rail=box(.16,.5,7.7,0xe9c8a9);rail.position.set(j?3.72:-3.72,.32,0);g.add(rail)}
  scene.add(g);road.push(g);
 }
 // fantasy towers / clouds
 for(let i=0;i<18;i++){
  const side=i%2?1:-1,z=-8-i*5;
  const island=sphere(1.4,0x79bd69);island.scale.y=.45;island.position.set(side*(5+Math.random()*2),-.2,z);scene.add(island);
  if(i%3===0){const t=box(1.1,2.5,1.1,0xe8c8aa);t.position.set(side*(5+Math.random()),1.1,z);scene.add(t);const roof=new THREE.Mesh(new THREE.ConeGeometry(.9,1.5,4),mat(0x9a70d8));roof.position.set(t.position.x,3.1,z);roof.rotation.y=.78;scene.add(roof)}
 }
}
function makeRunner(){
 runner=new THREE.Group();
 const skin=mat(0xf3b18c),hair=mat(0x71371f),pink=mat(0xff79a9),denim=mat(0x315f8f),white=mat(0xffffff);
 const head=sphere(.43,0xf3b18c);head.position.y=2.15;runner.add(head);
 const h=sphere(.48,0x71371f);h.scale.set(1.05,.85,1);h.position.set(0,2.35,.08);runner.add(h);
 const pony=sphere(.38,0x71371f);pony.scale.set(1.2,1.6,.8);pony.position.set(-.48,2.25,.1);runner.add(pony);
 const body=box(.82,.85,.48,0xff79a9);body.position.y=1.48;runner.add(body);
 const pack=box(.58,.62,.22,0xf5a8ba);pack.position.set(0,1.5,.35);runner.add(pack);
 const badge=sphere(.16,0xffffff);badge.scale.z=.35;badge.position.set(0,1.52,.49);runner.add(badge);
 const bow1=new THREE.Mesh(new THREE.ConeGeometry(.24,.42,4),pink);bow1.position.set(-.16,2.62,.05);bow1.rotation.z=-1.5;runner.add(bow1);
 const bow2=bow1.clone();bow2.position.x=.16;bow2.rotation.z=1.5;runner.add(bow2);
 for(let s of [-1,1]){
  const arm=box(.18,.72,.18,0xf3b18c);arm.position.set(s*.53,1.48,0);arm.userData.side=s;runner.add(arm);
  const leg=box(.24,.82,.25,0x315f8f);leg.position.set(s*.23,.72,0);leg.userData.leg=s;runner.add(leg);
  const shoe=box(.3,.18,.48,0xffffff);shoe.position.set(s*.23,.25,-.08);shoe.userData.shoe=s;runner.add(shoe);
 }
 runner.position.set(0,.12,2.1);runner.rotation.y=Math.PI;scene.add(runner);
}
function spawnQuestion(){
 if(q>=DATA.length){finish();return}
 $("word").textContent=DATA[q].w;$("progress").textContent=q+1;
 walls.forEach(w=>scene.remove(w));walls=[];wallZ=-36;
 const colors=["#168be0","#ed5367","#36bf52"];
 DATA[q].a.forEach((ans,j)=>{
  const g=new THREE.Group();const wall=box(2.1,2.35,.55,[0x168be0,0xed5367,0x36bf52][j]);wall.position.y=1.2;g.add(wall);
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(1.95,.95),new THREE.MeshBasicMaterial({map:textTexture(ans,colors[j]),transparent:false}));
  plane.position.set(0,1.35,.286);g.add(plane);g.position.set(lanes[j],0,wallZ);scene.add(g);walls.push(g);
 });
 // exactly one shield opportunity per 10-wall round, random question and random lane
 if(!shieldSpawned && q===Math.floor(Math.random()*Math.max(1,DATA.length-q))){
   spawnShield();
 }
}
function spawnShield(){
 shieldSpawned=true;const g=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(.48,.12,12,30),mat(0xffd35b));g.add(ring);
 const core=box(.48,.62,.15,0x89b7d9);core.rotation.z=.0;g.add(core);g.position.set(lanes[Math.floor(Math.random()*3)],1,-17);scene.add(g);shieldItem=g;
}
function move(d){lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}
function bind(){
 let sx=0,sy=0,down=false;
 addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;down=true});
 addEventListener("pointerup",e=>{if(!down)return;down=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){move(dx>0?1:-1)}});
 addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
 addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 $("restart").addEventListener("click",()=>location.reload());
}
function flash(t){const m=$("msg");m.textContent=t;m.classList.add("show");setTimeout(()=>m.classList.remove("show"),650)}
function collide(){
 const correct=lane===DATA[q].ok;
 if(correct){score+=10;flash("✨ ถูกต้อง! +10")}
 else if(hasShield){hasShield=false;flash("🛡️ โล่ป้องกันคะแนน!");$("shield").textContent="🛡️ ไม่มีโล่"}
 else{score=Math.max(0,score-5);lives--;flash("💥 ผิด -5");$("hearts").textContent="❤️".repeat(Math.max(0,lives))+"🖤".repeat(3-Math.max(0,lives))}
 $("score").textContent=score;q++;if(lives<=0){finish();return}spawnQuestion();
}
function finish(){paused=true;$("final").textContent=`คะแนน ${score} คะแนน`;$("end").style.display="grid"}
function loop(t){
 const dt=Math.min(.04,(t-last)/1000||.016);last=t;
 if(!paused){
  runner.position.x+=(targetX-runner.position.x)*Math.min(1,dt*13);
  const run=t*.012;runner.children.forEach(o=>{if(o.userData.leg)o.rotation.x=Math.sin(run*2+o.userData.leg)*.55;if(o.userData.side)o.rotation.x=Math.sin(run*2-o.userData.side)*.45});
  runner.position.y=.12+Math.abs(Math.sin(run*2))*.05;
  road.forEach(g=>{g.position.z+=dt*13;if(g.position.z>8)g.position.z-=96});
  walls.forEach(g=>g.position.z+=dt*13);
  if(walls[0]&&walls[0].position.z>1.0)collide();
  if(shieldItem){
    shieldItem.position.z+=dt*13;shieldItem.rotation.y+=dt*2.5;
    if(shieldItem.position.z>1.1&&shieldItem.position.z<3.2&&Math.abs(shieldItem.position.x-runner.position.x)<1.0){
      hasShield=true;$("shield").textContent="🛡️ มีโล่ 1 ครั้ง";flash("🛡️ ได้โล่ป้องกัน!");scene.remove(shieldItem);shieldItem=null;
    } else if(shieldItem.position.z>4){scene.remove(shieldItem);shieldItem=null}
  }
 }
 renderer.render(scene,camera);requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
